const icon=n=>`<svg viewBox="0 0 24 24" aria-hidden="true">${paths[n]||paths.target}</svg>`;const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const dateKey=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;const dayDate=s=>new Date(s+'T12:00:00');const today=()=>dateKey(new Date());const shift=(s,n)=>{const d=dayDate(s);d.setDate(d.getDate()+n);return dateKey(d)};const monday=s=>shift(s,-((dayDate(s).getDay()+6)%7));const monthEnd=s=>dateKey(new Date(+s.slice(0,4),+s.slice(5,7),0,12));const monthDays=s=>dayDate(monthEnd(s)).getDate();const fmt=(s,options={month:'short',day:'numeric'})=>dayDate(s).toLocaleDateString('en-GB',options);const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2);const KEY='xp_tracker_v2';
const defaults=()=>({version:2,categories:['Movement','Mind & focus','Wellbeing'],behaviors:{'Movement':[{id:'walk',name:'Go for a walk',points:20},{id:'workout',name:'Move your body · 30 minutes',points:40}],'Mind & focus':[{id:'read',name:'Read for 20 minutes',points:25},{id:'focus',name:'One focused work session',points:35}],'Wellbeing':[{id:'water',name:'Stay hydrated',points:15},{id:'reflect',name:'Take a moment to reflect',points:15}]},logs:{},holidays:{},dailyGoal:120,rewards:{day:'',week:'',month:'',goal:'',weeklyGoals:'',monthlyGoal:''},goals:{weeks:{},months:{}},fired:{}});
let state=defaults(),storageError=false;try{const s=localStorage.getItem(KEY);if(s)state=JSON.parse(s);else if(localStorage.getItem('xp_behaviors')){state.behaviors=JSON.parse(localStorage.getItem('xp_behaviors'));state.categories=JSON.parse(localStorage.getItem('xp_categories')||'null')||Object.keys(state.behaviors);state.logs=JSON.parse(localStorage.getItem('xp_logs')||'{}');state.dailyGoal=+(localStorage.getItem('xp_daily_goal')||120);state.rewards={...state.rewards,...JSON.parse(localStorage.getItem('xp_rewards')||'{}')};}}catch(e){storageError=true}
for(const log of Object.values(state.logs)){for(const [id,v] of Object.entries(log)){if(typeof v==='number'){const h=Object.values(state.behaviors).flat().find(h=>h.id===id);log[id]={points:v,name:h?.name||'Archived habit'};}}}
const allHabits=()=>state.categories.flatMap(c=>(state.behaviors[c]||[]).map(h=>({...h,category:c})));const xp=d=>state.holidays[d]!==undefined?state.holidays[d]:Object.values(state.logs[d]||{}).reduce((a,b)=>a+(typeof b==='number'?b:b.points),0);const activeDates=()=>[...new Set([...Object.keys(state.logs),...Object.keys(state.holidays)])].filter(d=>Object.keys(state.logs[d]||{}).length||state.holidays[d]!==undefined).sort();const weekXP=w=>Array.from({length:7},(_,i)=>xp(shift(w,i))).reduce((a,b)=>a+b,0);const monthXP=m=>activeDates().filter(d=>d.startsWith(m)).reduce((s,d)=>s+xp(d),0);const streak=()=>{let n=0,d=today();if(!activeDates().includes(d))d=shift(d,-1);const dates=new Set(activeDates());while(dates.has(d)){n++;d=shift(d,-1)}return n};const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Storage unavailable','Your changes are in memory only. Export a backup before closing.');return false}};const tabs=[['today','sun','Today'],['goals','target','Goals'],['stats','chart','Stats'],['history','history','History'],['habits','habits','Habits'],['settings','settings','Settings']];let tab='today',chartMode='daily',historyLimit=14;
function toast(title,message=''){const n=document.createElement('div');n.className='toast';n.innerHTML=icon('gift')+`<div><strong>${esc(title)}</strong>${message?`<p>${esc(message)}</p>`:''}</div><button aria-label="Dismiss notification">×</button>`;n.querySelector('button').onclick=()=>n.remove();document.getElementById('toasts').append(n);setTimeout(()=>n.remove(),9000)}
function head(title,sub,action=''){return `<div class="pagehead"><div><h1>${title}</h1><p class="subtitle">${sub}</p></div>${action}</div>`}function button(label,action,cls='secondary',ico='plus'){return `<button class="button ${cls}" data-action="${action}">${icon(ico)}${label}</button>`}function datePill(){return `<div class="datepill">${icon('calendar')}${fmt(today(),{weekday:'short',day:'numeric',month:'short',year:'numeric'})}</div>`}function weekStrip(){const w=monday(today());return `<div class="week-days">${Array.from({length:7},(_,i)=>{const d=shift(w,i);return `<div class="week-day">${['M','T','W','T','F','S','S'][i]}<div class="day-cell ${d===today()?'current':''} ${xp(d)>=state.dailyGoal&&state.dailyGoal>0?'met':''}" title="${fmt(d)}: ${xp(d)} XP">${xp(d)>=state.dailyGoal&&state.dailyGoal>0?icon('check'):dayDate(d).getDate()}</div></div>`}).join('')}</div>`}
function renderToday(){const t=today(),score=xp(t),logged=state.logs[t]||{},count=Object.keys(logged).length,habits=allHabits(),holiday=state.holidays[t]!==undefined,pct=state.dailyGoal>0?Math.max(0,Math.min(100,score/state.dailyGoal*100)):0,w=monday(t),wk=state.goals.weeks[w]||[],completed=wk.filter(g=>g.done).length;const avg=Array.from({length:7},(_,i)=>xp(shift(t,-i-1))).reduce((a,b)=>a+b,0)/7;return head('Make today count.','A little consistency goes a long way.',datePill())+`<div class="metrics"><section class="card xp-card"><div class="xp-head"><span class="eyebrow">TODAY’S EXPERIENCE</span>${icon('bolt')}</div><div class="xp-number ${score<0?'negative-text':''}">${score}<small>/ ${state.dailyGoal} XP</small></div><div class="track" role="progressbar" aria-label="Daily XP target" aria-valuenow="${Math.round(pct)}" aria-valuemin="0" aria-valuemax="100"><div class="fill" style="width:${pct}%"></div></div><div class="progress-meta"><span>${holiday?'Holiday mode · target covered':score>=state.dailyGoal&&state.dailyGoal>0?'Daily target reached':Math.max(0,state.dailyGoal-score)+' XP to your daily target'}</span><span>${Math.round(pct)}%</span></div></section><section class="card"><div class="metric-icon">${icon('flame')}</div><div class="metric-title">Current streak</div><div class="metric-number">${streak()} <small>${streak()===1?'day':'days'}</small></div><div class="metric-foot">${streak()?'Keep the momentum going.':'Your next chapter starts today.'}</div></section><section class="card"><div class="metric-icon purple">${icon('check')}</div><div class="metric-title">Habits completed</div><div class="metric-number">${count} <small>/ ${habits.length}</small></div><div class="metric-foot">${avg>0?`${Math.round(score-avg)>=0?'+':''}${Math.round(score-avg)} XP vs. 7-day average`:'One small step at a time.'}</div></section></div><div class="content-grid"><section><div class="sectionhead"><h2>Your daily habits</h2><button class="textbutton" data-nav="habits">Manage habits ${icon('arrow')}</button></div>${state.categories.map((c,i)=>{const hs=state.behaviors[c]||[];if(!hs.length)return '';return `<div class="habit-group"><div class="group-title"><span><i class="category-dot" style="background:${['#8670cf','#539ca2','#cb984f'][i%3]}"></i>${esc(c)}</span><span>${hs.filter(h=>logged[h.id]!==undefined).length} / ${hs.length}</span></div>${hs.map(h=>`<div class="habit-row ${logged[h.id]!==undefined?'done':''}"><button class="check ${logged[h.id]!==undefined?'done':''}" data-log="${esc(h.id)}" aria-label="${logged[h.id]!==undefined?'Undo':'Complete'} ${esc(h.name)}" aria-pressed="${logged[h.id]!==undefined}">${logged[h.id]!==undefined?icon('check'):''}</button><span class="habit-name">${esc(h.name)}</span><span class="points ${h.points<0?'negative':''}">${h.points>0?'+':''}${h.points} XP</span></div>`).join('')}</div>`}).join('')||`<div class="card empty">${icon('habits')}<strong>Make room for a good habit.</strong>Add your first habit to begin.<div class="actions" style="justify-content:center">${button('Add a habit','add-habit')}</div></div>`}</section><aside class="stack"><section class="card holiday"><div class="holiday-icon">${icon('palm')}</div><div><h3>Holiday mode</h3><p>${holiday?'Your daily target is covered. Habits still count toward frequency.':'Take a break. Keep your streak.<br>Your daily XP target is covered.'}</p></div><button class="switch" role="switch" aria-label="Holiday mode for today" aria-checked="${holiday}" data-action="holiday"></button></section><section class="card week-card"><div class="sectionhead"><h2>This week</h2><span class="muted" style="font-size:12px">${fmt(w)} – ${fmt(shift(w,6))}</span></div>${weekStrip()}<div class="week-summary"><span>Weekly experience</span><b>${weekXP(w)} XP</b></div></section><section class="card focus-card"><span class="eyebrow">A LITTLE BIGGER PICTURE</span><h3>${wk.length?`${completed} of ${wk.length} weekly goals complete`:'Small habits.<br>Bigger ambitions.'}</h3><p>${wk. function render(){document.querySelector('.nav').innerHTML=tabs.map(([id,ic,label])=>`<button aria-label="${label}" title="${label}" data-nav="${id}" class="${tab===id?'active':''} ${id==='settings'?'settings-nav':''}" ${tab===id?'aria-current="page"':''}>${icon(ic)}<span>${label}</span></button>`).join('');document.getElementById('breadcrumb').textContent=tabs.find(x=>x[0]===tab)[2];document.getElementById('app').innerHTML=tab==='today'?renderToday():(typeof renderPage==='function'?renderPage(tab):head(tabs.find(x=>x[0]===tab)[2],'Your workspace is taking shape.'));}
function toggleHabit(id,date=today()){const h=allHabits().find(h=>h.id===id);if(!h)throw Error('Habit not found');state.logs[date]??={};if(state.logs[date][id]!==undefined)delete state.logs[date][id];else state.logs[date][id]={points:h.points,name:h.name};save();if(typeof checkRewards==='function')checkRewards();render()}

</script><script>

function renderPage(t){return ({goals:renderGoals,stats:renderStats,history:renderHistory,habits:renderHabits,settings:renderSettings}[t]||renderToday)()}
function renderGoals(){const t=today(),w=monday(t),m=t.slice(0,7),week=state.goals.weeks[w]||[],month=state.goals.months[m]||[];return head('Give your progress direction.','A few meaningful goals. A little more intention.',datePill())+`<div class="goals-grid"><section class="card"><div class="wide-head"><div><div class="eyebrow muted" style="margin-bottom:9px">${fmt(w)} – ${fmt(shift(w,6))}</div><h2>This week’s goals</h2></div><span class="tag">${week.filter(g=>g.done).length} / ${week.length} complete</span></div>${goalRows(week,'week')}${week.length<7?button('Add weekly goal','add-week','secondary'):''}<div class="goal-note">Up to <b>7 goals</b>, one focused week. Complete them by <b>Sunday, ${fmt(shift(w,6))}</b> to earn your reward.</div><div class="reward-line">${icon('gift')}<span>${esc(state.rewards.weeklyGoals||'Set your weekly reward in Settings.')}</span></div></section><div class="stack"><section class="card"><div class="eyebrow muted" style="margin-bottom:9px">${fmt(t,{month:'long',year:'numeric'})}</div><div class="wide-head"><h2>Your monthly goal</h2><span class="tag">${month.filter(g=>g.done).length} / 1</span></div>${goalRows(month,'month')}${month.length? '':button('Add monthly goal','add-month','secondary')}<div class="goal-note">One bigger ambition. Complete it by <b>${fmt(monthEnd(t))}</b> to unlock your monthly reward.</div><div class="reward-line">${icon('gift')}<span>${esc(state.rewards.monthlyGoal||'Set your monthly reward in Settings.')}</span></div></section><div class="card focus-card"><span class="eyebrow">MAKE IT MEANINGFUL</span><h3>Choose progress you can recognise.</h3><p>Make each goal specific enough to know when it’s done. Your daily habits do the rest.</p></div></div></div>`}
function goalRows(gs,kind){return gs.length?gs.map(g=>`<div class="goal-row ${g.done?'done':''}"><button class="check ${g.done?'done':''}" data-action="toggle-goal" data-kind="${kind}" data-id="${esc(g.id)}" aria-label="${g.done?'Reopen':'Complete'} goal: ${esc(g.text)}" aria-pressed="${g.done}">${g.done?icon('check'):''}</button><div class="goal-text"><span>${esc(g.text)}</span>${g.done?'<small>Completed. Nicely done.</small>':''}</div><button class="iconbutton" data-action="edit-goal" data-kind="${kind}" data-id="${esc(g.id)}" aria-label="Edit goal">${icon('edit')}</button><button class="iconbutton" data-action="delete-goal" data-kind="${kind}" data-id="${esc(g.id)}" aria-label="Delete goal">${icon('trash')}</button></div>`).join(''):`<div class="empty">${icon('target')}<strong>${kind==='week'?'What matters this week?':'One goal. A whole month.'}</strong>${kind==='week'?'Start with one thing you’d be glad to finish.':'Give yourself something worth working toward.'}</div>`}
function currentGoals(kind){const key=kind==='week'?monday(today()):today().slice(0,7);const store=kind==='week'?state.goals.weeks:state.goals.months;return store[key]??(store[key]=[])}
function renderHistory(){const t=today();return head('Every day is part of the story.','Forgot to log a day? Pick a date and fill it in.',button('Log a past day','add-log','','calendar'))+`<section class="card"><div class="wide-head"><h2>Recent activity</h2><span class="tag">Last ${historyLimit} days</span></div>${Array.from({length:historyLimit},(_,i)=>{const d=shift(t,-i),entries=state.logs[d]||{},has=Object.keys(entries).length||state.holidays[d]!==undefined;return `<div class="history-row"><div class="date-box"><small>${fmt(d,{month:'short'}).toUpperCase()}</small>${dayDate(d).getDate()}</div><div class="history-info"><strong>${i===0?'Today':i===1?'Yesterday':fmt(d,{weekday:'long'})}${state.holidays[d]!==undefined?' · Holiday':''}</strong><p>${Object.entries(entries).map(([id,v])=>esc(typeof v==='object'?v.name:allHabits().find(h=>h.id===id)?.name||'Archived habit')).join(', ')||(state.holidays[d]!==undefined?'Daily target covered':'No habits logged')}</p></div><div class="history-xp ${xp(d)<0?'negative-text':''}">${has?xp(d):'—'} <small>XP</small></div><button class="textbutton" data-action="edit-log" data-date="${d}">${has?'Edit':'Add'} ${icon('edit')}</button></div>`}).join('')}<div class="actions">${button('Show 14 more days','more-history','secondary','history')}</div></section>`}
function renderHabits(){return head('Build your everyday.','Shape your habits, organise your categories, and make it yours.',button('New category','add-category'))+state.categories.map(c=>`<section class="card" style="margin-bottom:19px"><div class="wide-head"><h2>${esc(c)}</h2><div><button class="iconbutton" data-action="edit-category" data-category="${esc(c)}" aria-label="Rename ${esc(c)}">${icon('edit')}</button><button class="iconbutton" data-action="delete-category" data-category="${esc(c)}" aria-label="Delete ${esc(c)}">${icon('trash')}</button></div></div>${(state.behaviors[c]||[]).map((h,i)=>`<div class="habit-row" style="padding-left:0;padding-right:0"><div class="habit-name">${esc(h.name)}</div><span class="points ${h.points<0?'negative':''}">${h.points>0?'+':''}${h.points} XP</span><div class="manage-actions"><button class="iconbutton" data-action="move-up" data-id="${esc(h.id)}" ${i===0?'disabled':''} aria-label="Move ${esc(h.name)} up">${icon('up')}</button><button class="iconbutton" data-action="move-down" data-id="${esc(h.id)}" ${i===(state.behaviors[c].length-1)?'disabled':''} aria-label="Move ${esc(h.name)} down">${icon('down')}</button><button class="iconbutton" data-action="edit-habit" data-id="${esc(h.id)}" aria-label="Edit ${esc(h.name)}">${icon('edit')}</button><button class="iconbutton" data-action="delete-habit" data-id="${esc(h.id)}" aria-label="Delete ${esc(h.name)}">${icon('trash')}</button></div></div>`).join('')}<button class="textbutton" style="margin-top:13px" data-action="add-habit" data-category="${esc(c)}">${icon('plus')} Add habit</button></section>`).join('')}
function chartData(){const t=today();if(chartMode==='daily')return Array.from({length:7},(_,i)=>{const d=shift(t,i-6);return {label:fmt(d,{weekday:'short'}),value:xp(d)}});if(chartMode==='weekly')return Array.from({length:8},(_,i)=>{const d=shift(monday(t),(i-7)*7);return {label:fmt(d),value:weekXP(d)/7}});return Array.from({length:6},(_,i)=>{const d=dateKey(new Date(dayDate(t).getFullYear(),dayDate(t).getMonth()+i-5,1,12)),m=d.slice(0,7);return {label:fmt(d,{month:'short'}),value:monthXP(m)/monthDays(d)}})}
function renderStats(){const dates=activeDates(),weeks=[...new Set(dates.map(monday))],months=[...new Set(dates.map(d=>d.slice(0,7)))];const best=(xs,fn)=>xs.reduce((a,d)=>fn(d)>a.value?{date:d,value:fn(d)}:a,{date:'',value:0});const records=[['Best day',best(dates,xp),'XP'],['Best week',best(weeks,w=>weekXP(w)/7),'XP / day'],['Best month',best(months,m=>monthXP(m)/monthDays(m+'-01')),'XP / day']];const data=chartData(),max=Math.max(1,...data.map(x=>Math.abs(x.value)));const frequencies=allHabits().map(h=>{const ds=dates.filter(d=>state.logs[d]?.[h.id]!==undefined),days=ds.length?Math.round((Date.UTC(...today().split('-').map((v,i)=>i===1?+v-1:+v))-Date.UTC(...ds[0].split('-').map((v,i)=>i===1?+v-1:+v)))/86400000)+1:0;return {h,n:ds.length,interval:ds.length?days/ds.length:Infinity}}).sort((a,b)=>a.interval-b.interval);return head('See how far you’ve come.','Consistency tells a better story than a single day.',datePill())+`<div class="stats-records">${records.map(([label,r,unit])=>`<section class="card"><span class="eyebrow muted">${label}</span><div class="record-number">${Math.round(r.value*10)/10} <small>${unit}</small></div><div class="hint">${r.date?fmt(r.date.length===7?r.date+'-01':r.date,label==='Best month'?{month:'long',year:'numeric'}:{month:'short',day:'numeric',year:'numeric'}):'Your first record is ahead.'}</div></section>`).join('')}</div><section class="card" style="margin-bottom:22px"><div class="wide-head"><h2>Your XP rhythm</h2><div class="segmented" aria-label="Chart period">${[['daily','7 days'],['weekly','8 weeks'],['monthly','6 months']].map(([v,l])=>`<button data-action="chart" data-mode="${v}" class="${chartMode===v?'active':''}" aria-pressed="${chartMode===v}">${l}</button>`).join('')}</div></div><div class="chart" role="img" aria-label="${data.map(d=>d.label+': '+Math.round(d.value)+' XP').join(', ')}">${data.map((d,i)=>`<div class="bar-wrap"><span class="bar-value">${Math.round(d.value*10)/10}</span><div class="bar ${i===data.length-1?'latest':''}" style="height:${Math.abs(d.value)/max*145}px;${d.value<0?'background:#d68a97':''}"></div><span class="bar-label">${d.label}</span></div>`).join('')}</div><p class="hint" style="padding-top:10px">${chartMode==='daily'?'7-day average':chartMode==='weekly'?'8-week daily average':'6-month daily average'}: <b>${Math.round(data.reduce((s,d)=>s+d.value,0)/data.length*10)/10} XP</b>. ${chartMode!=='daily'?'Calendar periods include all days, including unlogged days.':''}</p></section><section class="card"><div class="wide-head"><h2>Habit frequency</h2><span class="tag">Since each habit’s first log</span></div>${frequencies.map(({h,n,interval},i)=>`<div class="frequency"><small>${String(i+1).padStart(2,'0')}</small><span>${esc(h.name)}</span><small>${n} ${n===1?'log':'logs'}</small><b style="font-size:13px">${n?(interval<=1?'Daily':'Every '+(Math.round(interval*10)/10)+' days'):'Not yet logged'}</b></div>`).join('')||'<div class="empty">Add habits to start seeing your rhythm.</div>'}<p class="hint">Habit check-offs on holiday days count here, even though they add no extra XP.</p></section>`}
function renderSettings(){return head('Make it your own.','Your targets, your rewards, your way.')+`<div class="settings-grid"><div class="stack"><section class="card"><h2>Your daily target</h2><form id="target-form"><label class="field">Daily XP goal<input type="number" name="target" min="1" max="1000000" step="1" required value="${state.dailyGoal}" class="inline-input"></label><p class="hint">Holiday mode credits this amount when you turn it on. Past holiday credits stay unchanged.</p><div class="actions"><button class="button" type="submit">Save target</button></div></form></section><section class="card"><h2>Your data</h2><p style="font-size:14px;margin-top:14px">${allHabits().length} habits · ${activeDates().length} days logged · ${activeDates().reduce((s,d)=>s+xp(d),0)} total XP</p><p class="hint">Saved in this browser, on this device. Export a backup regularly, especially before switching devices or clearing browser data.</p><div class="actions">${button('Export backup','export','secondary','download')}${button('Import backup','import','secondary','upload')}</div><p class="hint">Original XP Tracker backups are supported. Import replaces the included data.</p><div class="actions">${button('Reset all data','reset','danger','trash')}</div></section></div><section class="card"><div class="wide-head"><h2>Well-earned rewards</h2>${icon('gift')}</div><p class="hint">Write something worth celebrating. Your message appears when you earn the reward.</p><form id="rewards-form">${Object.entries(rewardLabels).map(([key,label])=>`<label class="field">${label}<input name="${key}" maxlength="300" value="${esc(state.rewards[key]||'')}" placeholder="${key==='weeklyGoals'?'e.g. A slow Sunday brunch':key==='monthlyGoal'?'e.g. Book a weekend adventure':'What’s your reward?'}"></label>`).join('')}<p class="hint">Weekly XP rewards are evaluated on Sunday; monthly XP records on the last day. Goal rewards appear as soon as all goals are complete, once per period.</p><div class="actions"><button class="button" type="submit">Save rewards</button></div></form></section></div>`}
const modal=document.getElementById('modal');function showModal(title,content,onSubmit,submit='Save'){modal.innerHTML=`<div class="dialog-head"><h2>${title}</h2><button class="iconbutton" type="button" data-close aria-label="Close dialog">${icon('close')}</button></div><form id="dialog-form">${content}<div id="dialog-error" class="error" role="alert"></div><div class="dialog-actions"><button type="button" class="button secondary" data-close>Cancel</button><button class="button" type="submit">${submit}</button></div></form>`;modal.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>modal.close());modal.querySelector('form').onsubmit=e=>{e.preventDefault();try{if(onSubmit(new FormData(e.target))!==false){save();modal.close();checkRewards();render()}}catch(err){document.getElementById('dialog-error').textContent=err.message}};modal.showModal()}
function confirmAction(title,text,fn,label='Delete'){showModal(title,`<p style="font-size:14px">${esc(text)}</p>`,()=>fn(),label)}
function editGoal(kind,id){const gs=currentGoals(kind),g=gs.find(g=>g.id===id);if(!g&&gs.length>=(kind==='week'?7:1))return;showModal(`${g?'Edit':'Add'} ${kind==='week'?'weekly':'monthly'} goal`,`<label class="field">What do you want to accomplish?<textarea name="text" maxlength="200" required placeholder="${kind==='week'?'e.g. Finish three strength sessions':'e.g. Finish the book on my nightstand'}">${esc(g?.text||'')}</textarea></label>`,fd=>{const text=fd.get('text').trim();if(!text)throw Error('Give your goal a name.');if(g){g.text=text;g.done=false;g.completedAt=null}else{if(gs.length>=(kind==='week'?7:1))throw Error('This period has reached its goal limit.');gs.push({id:uid(),text,done:false,completedAt:null})}})}
function editHabit(id,category){const h=allHabits().find(h=>h.id===id);if(!state.categories.length)return categoryForm();showModal(h?'Edit habit':'Add a habit',`<label class="field">Habit name<input name="name" maxlength="160" required value="${esc(h?.name||'')}" placeholder="e.g. Read for 20 minutes"></label><label class="field">Category<select name="category">${state.categories.map(c=>`<option ${c===(h?.category||category)?'selected':''} value="${esc(c)}">${esc(c)}</option>`).join('')}</select></label><label class="field">XP points<input type="number" name="points" step="1" min="-1000000" max="1000000" required value="${h?.points??20}"></label><p class="hint">Use negative XP for a penalty. Past logs keep their original name and points.</p>`,fd=>{const name=fd.get('name').trim(),points=Number(fd.get('points')),cat=fd.get('category');if(!name)throw Error('Enter a habit name.');if(!Number.isSafeInteger(points)||points===0)throw Error('Choose a non-zero whole number of XP.');if(h)state.behaviors[h.category]=state.behaviors[h.category].filter(x=>x.id!==id);(state.behaviors[cat]??=[]).push({id:h?.id||uid(),name,points})})}
function categoryForm(old){showModal(old?'Rename category':'New category',`<label class="field">Category name<input name="name" maxlength="60" required value="${esc(old||'')}" placeholder="e.g. Fitness"></label>`,fd=>{const name=fd.get('name').trim();if(!name||['__proto__','constructor','prototype'].includes(name))throw Error('Choose another category name.');if(name!==old&&state.categories.includes(name))throw Error('That category already exists.');if(old){state.categories[state.categories.indexOf(old)]=name;const hs=state.behaviors[old]||[];delete state.behaviors[old];state.behaviors[name]=hs}else{state.categories.push(name);state.behaviors[name]=[]}})}
function validDate(d){return /^\d{4}-\d{2}-\d{2}$/.test(d)&&dateKey(dayDate(d))===d&&d>='1900-01-01'&&d<=today()}
function editLog(d){if(!d){showModal('Log a past day',`<label class="field">Choose a date<input type="date" name="date" required min="1900-01-01" max="${today()}" value="${shift(today(),-1)}"></label>`,fd=>{const chosen=fd.get('date');if(!validDate(chosen))throw Error('Choose a valid date no later than today.');modal.close();setTimeout(()=>editLog(chosen),0);return false},'Continue');return}if(!validDate(d))return;const entries=state.logs[d]||{},hs=allHabits(),archived=Object.keys(entries).filter(id=>!hs.some(h=>h.id===id));showModal(`Log · ${fmt(d,{day:'numeric',month:'long',year:'numeric'})}`,`<p class="hint">Check off what you completed. Existing entries keep the XP originally earned.</p><label class="log-choice"><input type="checkbox" name="holiday" ${state.holidays[d]!==undefined?'checked':''}><span>Holiday mode</span><small>${state.holidays[d]??state.dailyGoal} XP</small></label>${hs.map(h=>`<label class="log-choice"><input type="checkbox" name="habit" value="${esc(h.id)}" ${entries[h.id]!==undefined?'checked':''}><span>${esc(h.name)}</span><small>${typeof entries[h.id]==='number'?entries[h.id]:entries[h.id]?.points??h.points} XP</small></label>`).join('')}${archived.map(id=>`<label class="log-choice"><input type="checkbox" name="habit" value="${esc(id)}" checked><span>${esc(entries[id]?.name||'Archived habit')}</span><small>${typeof entries[id]==='number'?entries[id]:entries[id].points} XP</small></label>`).join('')}`,fd=>{const log={};for(const id of fd.getAll('habit')){const h=hs.find(h=>h.id===id);log[id]=entries[id]??{points:h.points,name:h.name}}state.logs[d]=log;if(fd.has('holiday')){if(state.holidays[d]===undefined){if(state.dailyGoal<=0)throw Error('Set a positive daily XP goal first.');state.holidays[d]=state.dailyGoal}}else delete state.holidays[d]},'Save day')}
function fire(key,title,reward){if(state.fired[key])return;state.fired[key]=true;save();toast(title,reward||'You showed up and made it happen. Take a moment to celebrate.')}
function checkRewards(){const t=today(),w=monday(t),m=t.slice(0,7),dates=activeDates();if(xp(t)>0&&xp(t)>Math.max(0,...dates.filter(d=>d<t).map(xp))&&state.rewards.day)fire('day:'+t,'A new personal best!',state.rewards.day);if(dayDate(t).getDay()===0){const previous=[...new Set(dates.filter(d=>d<w).map(monday))];if(weekXP(w)/7>Math.max(0,...previous.map(k=>weekXP(k)/7))&&state.rewards.week)fire('week:'+w,'Your best week yet!',state.rewards.week);if(state.dailyGoal>0&&weekXP(w)/7>=state.dailyGoal&&state.rewards.goal)fire('goal:'+w,'Weekly XP target achieved!',state.rewards.goal)}if(t===monthEnd(t)){const previous=[...new Set(dates.filter(d=>d.slice(0,7)<m).map(d=>d.slice(0,7)))];if(monthXP(m)/monthDays(t)>Math.max(0,...previous.map(k=>monthXP(k)/monthDays(k+'-01')))&&state.rewards.month)fire('month:'+m,'Your best month yet!',state.rewards.month)}for(const [kind,store,reward] of [['week',state.goals.weeks,'weeklyGoals'],['month',state.goals.months,'monthlyGoal']]){for(const [period,gs] of Object.entries(store)){const end=kind==='week'?shift(period,6):monthEnd(period+'-01');if(gs.length&&gs.every(g=>g.done&&g.completedAt&&dateKey(new Date(g.completedAt))<=end))fire(reward+':'+period,kind==='week'?'Weekly goals, all done!':'Monthly goal achieved!',state.rewards[reward])}}}
function action(a,b){const id=b.dataset.id,cat=b.dataset.category,kind=b.dataset.kind;if(a==='add-week')editGoal('week');else if(a==='add-month')editGoal('month');else if(a==='edit-goal')editGoal(kind,id);else if(a==='toggle-goal'){const g=currentGoals(kind).find(g=>g.id===id);if(g){g.done=!g.done;g.completedAt=g.done?new Date().toISOString():null;save();checkRewards();render()}}else if(a==='delete-goal')confirmAction('Delete this goal?','This removes the goal from the current period.',()=>{const gs=currentGoals(kind);gs.splice(gs.findIndex(g=>g.id===id),1)});else if(a==='add-log')editLog();else if(a==='edit-log')editLog(b.dataset.date);else if(a==='more-history'){historyLimit+=14;render()}else if(a==='chart'){chartMode=b.dataset.mode;render()}else if(a==='add-category')categoryForm();else if(a==='edit-category')categoryForm(cat);else if(a==='delete-category')confirmAction('Delete category?',`Remove “${cat}” and its habits? Historical logs will be kept.`,()=>{state.categories=state.categories.filter(c=>c!==cat);delete state.behaviors[cat]});else if(a==='add-habit')editHabit(null,cat);else if(a==='edit-habit')editHabit(id);else if(a==='delete-habit')confirmAction('Delete habit?','Historical logs and XP will be kept.',()=>{for(const c of state.categories)state.behaviors[c]=(state.behaviors[c]||[]).filter(h=>h.id!==id)});else if(a==='move-up'||a==='move-down'){const h=allHabits().find(h=>h.id===id),arr=state.behaviors[h.category],i=arr.findIndex(h=>h.id===id),j=i+(a==='move-up'?-1:1);if(j>=0&&j<arr.length)[arr[i],arr[j]]=[arr[j],arr[i]];save();render()}else if(a==='export')exportBackup();else if(a==='import')document.getElementById('import-file').click();else if(a==='reset')confirmAction('Reset your tracker?','This permanently removes habits, logs, goals, and settings from this browser. Export a backup first if you want to keep them.',()=>{state=defaults();state.categories=[];state.behaviors={};},'Reset all data')}
document.addEventListener('submit',e=>{if(e.target.id==='target-form'){e.preventDefault();const v=Number(new FormData(e.target).get('target'));if(!Number.isSafeInteger(v)||v<=0||v>1000000)return;state.dailyGoal=v;save();toast('Daily target saved',v+' XP. Every day is a fresh start.')}if(e.target.id==='rewards-form'){e.preventDefault();const fd=new FormData(e.target);for(const k of Object.keys(rewardLabels))state.rewards[k]=fd.get(k).trim();save();toast('Rewards saved','Something good to work toward.')}});
function exportBackup(){const blob=new Blob([JSON.stringify({...state,exportedAt:new Date().toISOString()},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`xp-tracker-${today()}.json`;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast('Backup exported','Keep it somewhere safe.')}
function importState(raw){if(!raw||typeof raw!=='object'||Array.isArray(raw))throw Error('This is not a valid XP backup.');const next=structuredClone(state),has=Object.keys(raw).some(k=>['behaviors','logs','dailyGoal','rewards','goals','holidays','categories'].includes(k));if(!has)throw Error('No XP Tracker data was found.');const safeKey=k=>!['__proto__','prototype','constructor'].includes(k);if(raw.behaviors!==undefined){if(!raw.behaviors||typeof raw.behaviors!=='object'||Array.isArray(raw.behaviors))throw Error('Invalid habit data.');const ids=new Set();for(const [c,hs]of Object.entries(raw.behaviors)){if(!safeKey(c)||!Array.isArray(hs))throw Error('Invalid category.');for(const h of hs){if(!h||typeof h.id!=='string'||!safeKey(h.id)||ids.has(h.id)||typeof h.name!=='string'||!Number.isFinite(h.points)||h.points===0)throw Error('Invalid habit.');ids.add(h.id)}}next.behaviors=raw.behaviors;next.categories=Object.keys(raw.behaviors)}if(raw.categories!==undefined){if(!Array.isArray(raw.categories)||raw.categories.some(c=>typeof c!=='string'||!safeKey(c)))throw Error('Invalid categories.');next.categories=[...new Set([...raw.categories,...Object.keys(next.behaviors)])]}if(raw.logs!==undefined){if(!raw.logs||typeof raw.logs!=='object'||Array.isArray(raw.logs))throw Error('Invalid logs.');for(const [d,log] of Object.entries(raw.logs)){if(!validDate(d)||!log||typeof log!=='object'||Array.isArray(log))throw Error('Invalid log date.');for(const [id,v]of Object.entries(log)){if(!safeKey(id)||!(typeof v==='number'?Number.isFinite(v):v&&Number.isFinite(v.points)&&typeof v.name==='string'))throw Error('Invalid log points.')}}next.logs=raw.logs;if(raw.holidays===undefined)next.holidays={};}if(raw.dailyGoal!==undefined){const v=Number(raw.dailyGoal);if(!Number.isSafeInteger(v)||v<0||v>1000000)throw Error('Invalid daily goal.');next.dailyGoal=v}if(raw.rewards!==undefined){if(!raw.rewards||typeof raw.rewards!=='object')throw Error('Invalid rewards.');for(const k of Object.keys(rewardLabels)){if(raw.rewards[k]!==undefined){if(typeof raw.rewards[k]!=='string')throw Error('Invalid reward message.');next.rewards[k]=raw.rewards[k]}}}if(raw.holidays!==undefined){if(!raw.holidays||typeof raw.holidays!=='object'||Array.isArray(raw.holidays))throw Error('Invalid holiday data.');for(const [d,v]of Object.entries(raw.holidays))if(!validDate(d)||!Number.isFinite(v)||v<=0)throw Error('Invalid holiday credit.');next.holidays=raw.holidays}if(raw.goals!==undefined){if(!raw.goals||typeof raw.goals!=='object')throw Error('Invalid goals.');for(const [type,max]of [['weeks',7],['months',1]]){const periods=raw.goals[type];if(!periods||typeof periods!=='object'||Array.isArray(periods))throw Error('Invalid goal periods.');for(const [p,gs]of Object.entries(periods)){const d=type==='weeks'?p:p+'-01';if(!validDate(d)||(type==='weeks'&&monday(d)!==p)||!Array.isArray(gs)||gs.length>max)throw Error('Invalid goal period or limit.');const ids=new Set();for(const g of gs){if(!g||typeof g.id!=='string'||ids.has(g.id)||typeof g.text!=='string'||typeof g.done!=='boolean'||(g.done&&(!g.completedAt||!Number.isFinite(Date.parse(g.completedAt)))))throw Error('Invalid goal.');ids.add(g.id)}}}next.goals=raw.goals}if(raw.fired!==undefined){if(!raw.fired||typeof raw.fired!=='object'||Array.isArray(raw.fired)||Object.entries(raw.fired).some(([k,v])=>!safeKey(k)||typeof v!=='boolean'))throw Error('Invalid reward history.');next.fired=raw.fired}for(const log of Object.values(next.logs)){for(const [id,v]of Object.entries(log)){if(typeof v==='number'){const h=Object.values(next.behaviors).flat().find(h=>h.id===id);log[id]={points:v,name:h?.name||'Archived habit'};}}}next.version=2;return next}
document.getElementById('import-file').onchange=async e=>{const file=e.target.files[0];e.target.value='';if(!file)return;try{if(file.size>10000000)throw Error('Choose a backup smaller than 10 MB.');const next=importState(JSON.parse(await file.text()));confirmAction('Import this backup?','The data included in this backup will replace the matching data in this browser. Export your current tracker first if you want to keep it.',()=>{state=next;toast('Backup imported','Your progress is ready.');},'Import backup')}catch(err){toast('Could not import backup',err.message)}};
let lastDay=today();setInterval(()=>{if(today()!==lastDay){lastDay=today();if(modal.open)modal.close();checkRewards();render()}},15000);document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'){if(today()!==lastDay){lastDay=today();if(modal.open)modal.close();render()}checkRewards()}});window.addEventListener('storage',e=>{if(e.key===KEY&&e.newValue){try{state=importState(JSON.parse(e.newValue));if(modal.open)modal.close();render()}catch{toast('Sync interrupted','Reload this tab to see the latest saved data.')}}});
if(document.modelContext?.registerTool){try{Promise.resolve(document.modelContext.registerTool({name:'read_habit_tracker',title:'Read habit tracker',description:'Read today’s habits, XP, holiday mode, and current goals from this personal tracker.',inputSchema:{type:'object',properties:{},additionalProperties:false},annotations:{readOnlyHint:true,untrustedContentHint:true},execute:input=>{if(!input||typeof input!=='object'||Object.keys(input).length)throw Error('Expected an empty object.');return {date:today(),xp:xp(today()),dailyGoal:state.dailyGoal,holiday:state.holidays[today()]!==undefined,habits:allHabits().map(h=>({...h,completed:state.logs[today()]?.[h.id]!==undefined})),weeklyGoals:state.goals.weeks[monday(today())]||[],monthlyGoals:state.goals.months[today().slice(0,7)]||[]}}})).catch(()=>{})}catch{}}
render();checkRewards();if(storageError)toast('Saved data could not be loaded','Your existing storage has not been overwritten. Import a backup to restore your tracker.');

</script></body></html>
